<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apartment Floor Plan Activity</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header>
      <h1>Apartment Floor Plan Activity</h1>
    </header>


    <section class="card">

      <h2>Identify the Areas</h2>


      <form id="answerForm">


        <!-- A -->

        <div class="answer-row">

          <label for="answer-A">A</label>

          <select id="answer-A" name="A" required>

            <option value="" selected disabled>
              Choose an area...
            </option>

            <option value="Living room">Living room</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Children rooms">Children rooms</option>
            <option value="Parents suite">Parents suite</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Home office">Home office</option>

          </select>

        </div>


        <!-- B -->

        <div class="answer-row">

          <label for="answer-B">B</label>

          <select id="answer-B" name="B" required>

            <option value="" selected disabled>
              Choose an area...
            </option>

            <option value="Living room">Living room</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Children rooms">Children rooms</option>
            <option value="Parents suite">Parents suite</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Home office">Home office</option>

          </select>

        </div>


        <!-- C + D -->

        <div class="answer-row">

          <label for="answer-CD">C + D</label>

          <select id="answer-CD" name="CD" required>

            <option value="" selected disabled>
              Choose an area...
            </option>

            <option value="Living room">Living room</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Children rooms">Children rooms</option>
            <option value="Parents suite">Parents suite</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Home office">Home office</option>

          </select>

        </div>


        <!-- E -->

        <div class="answer-row">

          <label for="answer-E">E</label>

          <select id="answer-E" name="E" required>

            <option value="" selected disabled>
              Choose an area...
            </option>

            <option value="Living room">Living room</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Children rooms">Children rooms</option>
            <option value="Parents suite">Parents suite</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Home office">Home office</option>

          </select>

        </div>


        <!-- F + G + I -->

        <div class="answer-row">

          <label for="answer-FGI">F + G + I</label>

          <select id="answer-FGI" name="FGI" required>

            <option value="" selected disabled>
              Choose an area...
            </option>

            <option value="Living room">Living room</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Children rooms">Children rooms</option>
            <option value="Parents suite">Parents suite</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Home office">Home office</option>

          </select>

        </div>


        <!-- H -->

        <div class="answer-row">

          <label for="answer-H">H</label>

          <select id="answer-H" name="H" required>

            <option value="" selected disabled>
              Choose an area...
            </option>

            <option value="Living room">Living room</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Children rooms">Children rooms</option>
            <option value="Parents suite">Parents suite</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Home office">Home office</option>

          </select>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

          <button type="submit">
            Submit Answers
          </button>

          <button
            type="button"
            id="resetBtn"
            class="secondary">
            Reset
          </button>

        </div>

      </form>


      <!-- RESULT -->

      <div
        id="result"
        class="result"
        hidden>
      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>

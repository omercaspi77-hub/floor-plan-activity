<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Floor Plan Activity</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header>
      <h1>Apartment Floor Plan Activity</h1>
      <p>Study the floor plan and identify each area.</p>
    </header>

    <section class="card">
      <h2>Identify the Areas</h2>

      <p class="instructions">
        Choose the correct area for each group of letters.
      </p>

      <form id="answerForm">

        <div class="answer-row">
          <label for="answer-A">A —</label>
          <select id="answer-A" name="A" required>
            <option value="" selected disabled>Choose an area...</option>
            <option>Living room</option>
            <option>Kitchen</option>
            <option>Children rooms</option>
            <option>Parents suite</option>
            <option>Bathrooms</option>
            <option>Home office</option>
          </select>
        </div>

        <div class="answer-row">
          <label for="answer-B">B —</label>
          <select id="answer-B" name="B" required>
            <option value="" selected disabled>Choose an area...</option>
            <option>Living room</option>
            <option>Kitchen</option>
            <option>Children rooms</option>
            <option>Parents suite</option>
            <option>Bathrooms</option>
            <option>Home office</option>
          </select>
        </div>

        <div class="answer-row">
          <label for="answer-CD">C + D —</label>
          <select id="answer-CD" name="CD" required>
            <option value="" selected disabled>Choose an area...</option>
            <option>Living room</option>
            <option>Kitchen</option>
            <option>Children rooms</option>
            <option>Parents suite</option>
            <option>Bathrooms</option>
            <option>Home office</option>
          </select>
        </div>

        <div class="answer-row">
          <label for="answer-E">E —</label>
          <select id="answer-E" name="E" required>
            <option value="" selected disabled>Choose an area...</option>
            <option>Living room</option>
            <option>Kitchen</option>
            <option>Children rooms</option>
            <option>Parents suite</option>
            <option>Bathrooms</option>
            <option>Home office</option>
          </select>
        </div>

        <div class="answer-row">
          <label for="answer-FGI">F + G + I —</label>
          <select id="answer-FGI" name="FGI" required>
            <option value="" selected disabled>Choose an area...</option>
            <option>Living room</option>
            <option>Kitchen</option>
            <option>Children rooms</option>
            <option>Parents suite</option>
            <option>Bathrooms</option>
            <option>Home office</option>
          </select>
        </div>

        <div class="answer-row">
          <label for="answer-H">H —</label>
          <select id="answer-H" name="H" required>
            <option value="" selected disabled>Choose an area...</option>
            <option>Living room</option>
            <option>Kitchen</option>
            <option>Children rooms</option>
            <option>Parents suite</option>
            <option>Bathrooms</option>
            <option>Home office</option>
          </select>
        </div>

        <div class="buttons">
          <button type="submit">Submit Answers</button>
          <button type="button" id="resetBtn" class="secondary">
            Reset
          </button>
        </div>

      </form>

      <div id="result" class="result" hidden></div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
